name: Test RDP Cache Atomic (T1113)

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'atomics/T1113/**'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'atomics/T1113/**'
  workflow_dispatch:

jobs:
  test-atomic-t1113:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: 🛠️ Setup - Create Dummy RDP Cache Artifacts
      # Required because GitHub runners don't have real RDP history
      run: |
        $CachePath = "$env:LOCALAPPDATA\Microsoft\Terminal Server Client\Cache"
        New-Item -Path $CachePath -ItemType Directory -Force | Out-Null
        
        # Create dummy bcache.bmc and bin files
        $DummyData = new-object byte[] 1024
        (new-object Random).NextBytes($DummyData)
        [IO.File]::WriteAllBytes("$CachePath\bcache.bmc", $DummyData)
        [IO.File]::WriteAllBytes("$CachePath\Cache0000.bin", $DummyData)
        
        Write-Host "Created dummy RDP cache files at $CachePath"

    - name: 📥 Install Invoke-AtomicRedTeam Module
      # FIXED STEP: Install directly from PSGallery instead of using the wrapper script
      run: |
        Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
        
        # 1. Bootstrap the NuGet provider (required for module installation)
        Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
        
        # 2. Install the Atomic Red Team framework module
        # -SkipPublisherCheck is often needed in CI to avoid confirmation prompts
        Install-Module -Name Invoke-AtomicRedTeam -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck
        
        # 3. Import to verify
        Import-Module Invoke-AtomicRedTeam -Force
        Write-Host "Invoke-AtomicRedTeam successfully installed."
      shell: powershell

    - name: 🧪 Run Atomic Test T1113
      run: |
        # Point to the 'atomics' folder in your checked-out repo
        $RepoAtomicsPath = "$env:GITHUB_WORKSPACE\atomics"
        
        Write-Host "Running T1113 from: $RepoAtomicsPath"
        
        # Run the tests. We use the updated T1113 yaml from your checkout.
        # We target specific GUIDs or just run the whole technique.
        Invoke-AtomicTest T1113 -PathToAtomicsFolder $RepoAtomicsPath -GetPrereqs
        Invoke-AtomicTest T1113 -PathToAtomicsFolder $RepoAtomicsPath -Force
      shell: powershell
